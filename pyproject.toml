[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-blender"
version = "0.1.0"
description = "MCP-native Blender control layer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.28,<3"]

[project.scripts]
agentic-blender-mcp = "agentic_blender.server:main"

[tool.setuptools.packages.find]
include = ["agentic_blender*"]
